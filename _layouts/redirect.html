<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
  </head>
  <body>
    <p>Redirecting to <a href="{{ page.redirect_to | relative_url }}">the current page</a>.</p>
  </body>
</html>
